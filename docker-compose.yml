services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: image_mvp_api
    ports:
      - "8100:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - image_mvp_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: image_mvp_frontend
    ports:
      - "3100:3000"
    environment:
      - VITE_API_BASE_URL=
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000
    networks:
      - image_mvp_network

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: image_mvp_worker
    env_file:
      - .env
    depends_on:
      - redis
      - minio
    volumes:
      - ./backend:/app/backend
      - ./worker:/app/worker
    command: python -m worker.main
    networks:
      - image_mvp_network

  nginx:
    image: nginx:1.27-alpine
    container_name: image_mvp_nginx
    ports:
      - "8088:80"
    depends_on:
      - frontend
      - api
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - image_mvp_network

  redis:
    image: redis:7-alpine
    container_name: image_mvp_redis
    ports:
      - "6380:6379"
    networks:
      - image_mvp_network

  minio:
    image: minio/minio:latest
    container_name: image_mvp_minio
    ports:
      - "9100:9000"
      - "9101:9001"
    env_file:
      - .env
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    networks:
      - image_mvp_network

  postgres:
    image: postgres:16-alpine
    container_name: image_mvp_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: image_composer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - image_mvp_network

networks:
  image_mvp_network:
    driver: bridge
